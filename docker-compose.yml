version: '3.8'

services:
  wiki-app:
    build: .
    ports:
      - "6767:6767"
    environment:
      - DATABASE_HOST=<YOUR_PI_IP_ADDRESS>
      - DATABASE_PORT=3306
      - DATABASE_USER=root
      - DATABASE_PASSWORD=your_password
      - DATABASE_NAME=your_database_name
    volumes:
      - ./static:/app/static
      - ./templates:/app/templates
    networks:
      - wiki-network

networks:
  wiki-network:
    driver: bridge
